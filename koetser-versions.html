<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koetser Gallery — Old Master Paintings, Zurich</title>
<meta name="description" content="Koetser Gallery, Zurich. Third-generation dealers in Old Master Paintings, with a focus on the Northern Renaissance and the Dutch Golden Age. By appointment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
/* DESIGN PROPOSALS: pick the version before first paint (URL ?v=2 wins, then the last one viewed) */
(function(){
  var F={2:'family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500',
         3:'family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Inter:wght@300;400;500;600',
         4:'family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&family=IBM+Plex+Mono:wght@400;500'};
  window.KV_FONTS=F;
  window.kvFonts=function(v){ if(!F[v]||document.getElementById('kvf'+v)) return; var l=document.createElement('link'); l.id='kvf'+v; l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?'+F[v]+'&display=swap'; document.head.appendChild(l); };
  var v=(location.search.match(/[?&]v=([1-4])/)||[])[1];
  if(!v){ try{ v=localStorage.getItem('koetser-v'); }catch(e){} }
  if(!/^[1-4]$/.test(v||'')) v='1';
  document.documentElement.setAttribute('data-v',v); kvFonts(v);
})();
</script>
<!--
  KOETSER GALLERY — REDESIGN DEMO, FOUR DESIGN PROPOSALS V1–V4 (Art Deputy)
  Switch in the header, or open with ?v=1 … ?v=4. Content and scripts are shared; see “DESIGN PROPOSALS” in the styles.
  Routes: #/ · #/paintings · #/painting/<slug> · #/notable-sales · #/sale/<slug> · #/events · #/event/<slug> · #/services · #/about · #/contact
  In the room: see “VIEWING ROOM — RULES” in the script (empty gallery wall + 1.80 m visitor cut-out, true scale).
  Images load from the live site (www.koetsergallery.com/uploads/…), same paths as the back-office.
-->
<style>
:root{
  --bg:#f4f4f1;--panel:#e9e8e3;--paper:#ffffff;--ink:#111214;--ink2:#3f4146;--muted:#6a6c71;--line:#d9d8d2;
  --blue:#111214;--dark:#0f1012;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gut:clamp(16px,3.2vw,48px);--navh:72px;--ease:cubic-bezier(.22,.7,.12,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.005em}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
::selection{background:#d8d4cb;color:var(--ink)}
.wrap{padding-inline:var(--gut);max-width:1720px;margin-inline:auto}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.045em;line-height:.95;text-wrap:balance}
.d1{font-size:clamp(56px,10vw,168px)}
.d2{font-size:clamp(40px,6vw,96px)}
.d3{font-size:clamp(30px,3.4vw,52px);letter-spacing:-.035em;line-height:1.02}
.d4{font-size:clamp(22px,2vw,28px);letter-spacing:-.025em;line-height:1.15}
.t{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.lede{font-size:clamp(20px,1.7vw,25px);line-height:1.4;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font:500 14px/1 var(--sans);letter-spacing:-.01em;border:1px solid var(--ink);transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.fill:hover{background:#3a3c41;border-color:#3a3c41;color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px}
.link{display:inline-flex;gap:8px;align-items:center;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px;transition:color .3s,gap .3s}
.link:hover{opacity:.6;gap:12px}
.link svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--paper)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#1f9d55}
.pill.blue{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dark .pill.blue{background:#f1f0ec;border-color:#f1f0ec;color:var(--dark)}
.pill.sold{background:#8a1c1c;border-color:#8a1c1c;color:#fff}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}*{animation:none!important;scroll-behavior:auto!important}.plx-in{transform:none!important}}

/* NAV */
.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(244,244,241,.82);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-color:var(--line)}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--navh);gap:24px}
.logo{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.logo b{font:600 17px/1 var(--sans);letter-spacing:.22em}
.logo span{font:400 11px/1 var(--mono);color:var(--muted)}
.menu{display:flex;gap:2px;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:999px;padding:4px}
.menu a{font:450 14px/1 var(--sans);padding:10px 14px;border-radius:999px;color:var(--ink2);transition:background .3s,color .3s;white-space:nowrap}
.menu a:hover{color:var(--ink);background:rgba(17,18,20,.05)}
.menu a.on{background:var(--ink);color:var(--bg)}
.nav-r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.sbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.65);color:var(--ink2);font-size:14px;transition:border-color .3s}
.sbtn:hover{border-color:var(--ink);color:var(--ink)}
.sbtn svg{width:16px;height:16px}
.sbtn kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center}
.burger i{display:block;width:16px;height:1.5px;background:var(--ink);box-shadow:0 5px 0 var(--ink);transform:translateY(-2.5px)}
@media (max-width:1180px){
  .nav .wrap{grid-template-columns:1fr auto}
  .menu{display:none}.nav-r .btn{display:none}.burger{display:flex}.sbtn span,.sbtn kbd{display:none}.sbtn{padding:0;width:44px;justify-content:center}
  .nav.open{background:var(--bg)}
  .nav.open .menu{display:flex;flex-direction:column;position:fixed;inset:var(--navh) 0 0;border:0;border-radius:0;background:var(--bg);padding:24px var(--gut);gap:0}
  .nav.open .menu a{font-size:38px;letter-spacing:-.04em;padding:12px 0;border-radius:0;border-bottom:1px solid var(--line);background:none;color:var(--ink)}
}
#app{min-height:100vh}
.page-in{animation:pageIn .7s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cur{position:fixed;left:0;top:0;z-index:70;pointer-events:none;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--sans);transform:scale(0);transition:transform .35s var(--ease)}
#cur.on{transform:scale(1)}
@media (hover:none){#cur{display:none}}

/* SEARCH OVERLAY */
.srch{position:fixed;inset:0;z-index:180;background:var(--bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;overflow:auto}
.srch.on{display:block;animation:pageIn .35s var(--ease)}
.srch-top{position:sticky;top:0;background:rgba(244,244,241,.96);border-bottom:1px solid var(--line);z-index:2}
.srch-top .wrap{display:flex;align-items:center;gap:16px;min-height:104px}
.srch-top svg{width:28px;height:28px;flex:none;color:var(--muted)}
.srch-top input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:500 clamp(28px,4vw,56px)/1.1 var(--sans);letter-spacing:-.04em;color:var(--ink)}
.srch-top input::placeholder{color:#b3b3ad}
.srch-scopes{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0}
.srch-body{padding-bottom:80px}
.srch-grp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:28px 0;border-top:1px solid var(--line)}
.srch-grp h3{font-size:22px;letter-spacing:-.025em}
.srch-grp h3 sup{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.srch-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.hit{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:10px;border-radius:10px;transition:background .25s}
.hit:hover,.hit:focus-visible{background:var(--paper)}
.hit .th{width:64px;height:64px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px;padding:6px}
.hit .th img{max-width:100%;max-height:100%;width:auto;height:auto}
.hit .th svg{width:22px;height:22px;color:var(--muted)}
.hit b{display:block;font-weight:500;font-size:14px}
.hit .t{font-size:18px;line-height:1.2;display:block}
.hit small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hit mark{background:rgba(17,18,20,.12);color:inherit;border-radius:2px}
.srch-empty{padding:48px 0;color:var(--muted)}
.srch-sugg{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.srch-grp{grid-template-columns:1fr;gap:12px}}

/* PARALLAX BANDS (home only) */
.plx{position:relative;width:100%;height:max(560px,100vh);overflow:hidden;background:var(--dark);margin:0}
.plx-in{position:absolute;left:0;right:0;top:-14%;height:128%;background-repeat:no-repeat;background-size:cover;will-change:transform}
.plx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 25%,transparent 70%,rgba(0,0,0,.45))}
.plx figcaption{position:absolute;left:var(--gut);right:var(--gut);bottom:28px;z-index:2;color:#f5f4f0;font-size:13px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.plx figcaption .t{font-size:18px}
.plx figcaption a{border-bottom:1px solid rgba(255,255,255,.5)}

/* HOME HERO: stories (fair, discovery, sale, gallery) */
.hero{padding-top:var(--navh);min-height:max(720px,100svh);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:1fr auto;grid-template-areas:"copy stage" "cap stage"}
.hero-copy{grid-area:copy;padding:clamp(40px,6vw,96px) var(--gut) 24px;display:flex;flex-direction:column;justify-content:center}
.hero-copy h1{margin:0 0 28px;font-size:clamp(52px,6.6vw,116px)}
.hero-copy p{max-width:40ch;color:var(--ink2);margin:0 0 32px;font-size:17px}
.hero-cap{grid-area:cap;padding:0 var(--gut) 36px}
.hero-cap .in{border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:end;min-height:150px}
.hero-cap .kind{grid-column:1/-1}
.hero-cap h2{font-size:clamp(24px,2.2vw,32px);letter-spacing:-.03em;line-height:1.1;margin:0}
.hero-cap h2 .t{letter-spacing:-.01em}
.hero-cap p{margin:6px 0 0;color:var(--ink2);font-size:15px;max-width:46ch}
.hero-cap .go{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.hero-r{grid-area:stage;position:relative;background:var(--panel);overflow:hidden}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 1.4s var(--ease),visibility 1.4s}
.slide.on{opacity:1;visibility:visible}
.slide.art{padding:clamp(40px,7vw,120px)}
.slide.art>img{max-height:100%;width:auto;max-width:100%;box-shadow:0 30px 60px -25px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.12);transform:scale(.97);transition:transform 6.5s var(--ease)}
.slide.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7s var(--ease)}
.slide.on>img{transform:scale(1)}
.hero-ctrl{position:absolute;right:var(--gut);bottom:24px;display:flex;gap:8px;z-index:2}
.hero-ctrl button{width:44px;height:44px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.hero-ctrl button:hover{background:var(--ink);color:var(--bg)}
.hero-ctrl svg{width:16px;height:16px}
.bar-prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(17,18,20,.1);z-index:2}
.bar-prog i{display:block;height:100%;background:var(--ink);width:0}
.bar-prog i.run{animation:prog 7s linear forwards}
@keyframes prog{to{width:100%}}
@media (max-width:900px){.hero{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"stage" "cap" "copy"}.hero-r{min-height:58vh}.hero-cap{padding-top:20px}.hero-cap .in{border-top:0;padding-top:0;min-height:0;grid-template-columns:1fr}.hero-cap .go{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.hero-copy{padding-top:24px;border-top:1px solid var(--line);margin-inline:var(--gut);padding-inline:0}}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec{padding-block:clamp(96px,11vw,176px)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(40px,5vw,72px)}
.sh h2{margin-top:16px}
.facts-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.facts-row>div{padding:28px 24px 0 0;border-right:1px solid var(--line);margin-right:24px}
.facts-row>div:last-child{border:0;margin:0}
.facts-row b{display:block;font:500 clamp(48px,5vw,84px)/1 var(--sans);letter-spacing:-.05em}
.facts-row span{display:block;margin-top:10px;color:var(--ink2);max-width:22ch;font-size:15px}
@media (max-width:760px){.facts-row{grid-template-columns:1fr 1fr;row-gap:28px}.facts-row>div:nth-child(2){border:0;margin:0}}
.hang{position:relative;overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:none;padding-bottom:90px}
.hang::-webkit-scrollbar{display:none}
.hang.drag{cursor:grabbing}
.hang-in{display:flex;align-items:center;gap:clamp(40px,5vw,88px);padding:40px var(--gut) 0;width:max-content;min-height:calc(var(--hh) * 1.25)}
.hang figure{margin:0;position:relative;flex:none;user-select:none}
.hang img{height:var(--hh);width:auto;box-shadow:0 22px 44px -22px rgba(0,0,0,.5);pointer-events:none;-webkit-user-drag:none}
.hang figcaption{position:absolute;top:100%;left:0;width:max(100%,220px);padding-top:14px}
.hang figcaption b{font-size:13px;font-weight:500;display:block}
.hang figcaption .t{font-size:17px;line-height:1.2;display:block}
.hang-prog{height:2px;background:var(--line);margin:0 var(--gut);position:relative}
.hang-prog i{position:absolute;left:0;top:0;height:100%;background:var(--ink);width:10%}
.marquee{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding-block:22px}
.marquee div{display:inline-flex;gap:48px;animation:mq 90s linear infinite;padding-right:48px}
.marquee span{font-size:clamp(22px,2.2vw,32px);letter-spacing:-.03em;color:var(--ink2)}
.marquee span::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-left:48px;vertical-align:middle}
@keyframes mq{to{transform:translateX(-50%)}}
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.svc-grid a{padding:32px 32px 40px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-height:230px;transition:padding .5s var(--ease)}
.svc-grid a:not(:nth-child(3n)){border-right:1px solid var(--line);margin-right:32px}
.svc-grid a:hover{padding-left:14px}
.svc-grid a:hover h3{opacity:.65}
.svc-grid p{margin:0;color:var(--ink2);max-width:36ch}
.svc-grid .go{margin-top:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.svc-grid .go svg{width:16px;height:16px}
@media (max-width:900px){.svc-grid{grid-template-columns:1fr}.svc-grid a:not(:nth-child(3n)){border-right:0;margin-right:0}}
.dark{background:var(--dark);color:#f1f0ec;--line:#2a2b2f;--muted:#9a9ca1;--ink2:#c9c9c6;--panel:#1b1c1f;--paper:#1b1c1f;--bg:#0f1012}
.dark .btn{border-color:#f1f0ec}.dark .btn:hover{background:#f1f0ec;color:var(--dark)}
.dark .pill{color:#e3e3df}

/* events card: image/logo always whole */
.evc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:stretch}
.evc-img{position:relative;background:var(--panel);min-height:340px;display:flex;align-items:center;justify-content:center;padding:clamp(20px,3vw,44px)}
.evc-img img{max-width:100%;max-height:440px;width:auto;height:auto;object-fit:contain;transition:transform 1.2s var(--ease)}
.evc:hover .evc-img img{transform:scale(1.02)}
.evc-img .mark{font:500 clamp(40px,5vw,72px)/.9 var(--sans);letter-spacing:-.05em;text-align:center}
.evc-body{display:flex;flex-direction:column;gap:18px;padding-block:8px}
.evc-body dl{margin:0;display:grid;border-top:1px solid var(--line)}
.evc-body dl div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.evc-body dd{margin:0}
@media (max-width:900px){.evc{grid-template-columns:1fr}.evc-img{min-height:220px}}
.ph{padding:clamp(120px,14vw,190px) 0 clamp(40px,5vw,64px)}
.ph h1{margin-top:18px}
.ph-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-top:32px}
.ph-row p{margin:0;max-width:54ch;color:var(--ink2);font-size:17px}

/* PAINTINGS */
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));z-index:20;background:rgba(244,244,241,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-block:1px solid var(--line)}
.tools .wrap{display:flex;gap:12px;align-items:center;min-height:68px;flex-wrap:wrap;padding-block:10px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--paper);min-height:44px;flex:0 1 260px}
.search input{border:0;background:transparent;font:400 15px var(--sans);width:100%;outline:none;color:var(--ink)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink2);transition:.25s;display:inline-flex;align-items:center;gap:6px}
.chip sup{font:500 10px var(--mono);color:var(--muted)}
.chip:hover{border-color:var(--ink)}

/* IN THE ROOM — real photographs, painting placed at true scale */

.films{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

/* SERVICES / ABOUT / FORMS */
.svc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,110px);align-items:center;padding-block:clamp(64px,8vw,120px);border-top:1px solid var(--line)}

.ba{position:relative;overflow:hidden;user-select:none}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,110px);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.prose p{margin:0 0 1.2em;max-width:62ch;color:var(--ink2);font-size:17px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;transition:border-color .25s}

@media (max-width:640px){.form{grid-template-columns:1fr}}
.sent{font-size:22px;letter-spacing:-.02em;padding:24px 0;margin:0}

.sheet{width:min(600px,100%);background:var(--bg);padding:clamp(24px,3.5vw,48px);overflow:auto;animation:slideIn .5s var(--ease)}

.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.x:hover{border-color:var(--ink)}
.ref{display:flex;gap:16px;align-items:center;padding:14px;margin:20px 0 24px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}

.ref b{display:block;font-weight:500;font-size:14px}
.ref .t{font-size:17px;line-height:1.2}
.news{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end}

.nl{display:flex;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 20px}
.nl input{flex:1;min-width:0;border:0;background:transparent;font:400 16px var(--sans);outline:none;color:var(--ink)}
footer{padding-block:88px 32px}

.fgrid a:hover{opacity:.6}
.fbig{display:flex;justify-content:space-between;align-items:baseline;font:500 clamp(52px,12.5vw,230px)/1 var(--sans);letter-spacing:0;margin:88px 0 10px;color:#f1f0ec}
.fbig-sub{display:flex;justify-content:space-between;font:400 clamp(10px,1vw,13px)/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0 0 36px}

.socials{display:flex;gap:8px;margin-top:24px}

@media (max-width:1000px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 20px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.mbar span{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg);min-height:40px}}
/* room setup tool */
/* white-margin handling, see WHITE BACKGROUNDS in the script */
.cell img,.hang img,.dt-stage>img,.slide.art>img,.ix-row .th img,.ref img,.dt-nav img,#peek img,.room .piece img{mix-blend-mode:multiply;box-shadow:none}
.cell img.clean,.hang img.clean,.slide.art>img.clean{mix-blend-mode:normal;box-shadow:0 16px 30px -16px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.12)}
.dt-stage>img.clean{mix-blend-mode:normal;box-shadow:0 40px 70px -30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.12)}
.ix-row .th img.clean,.ref img.clean,.dt-nav img.clean{mix-blend-mode:normal}
.room .piece.bare{box-shadow:none}
.room .piece.clean{box-shadow:0 16px 22px -10px rgba(40,25,10,.5)}
.room .piece.clean img{mix-blend-mode:normal}
/* NEWS */
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
@media (max-width:1000px){.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.ngrid{grid-template-columns:1fr}}
.ncard a{display:flex;flex-direction:column;gap:12px}
.nimg{aspect-ratio:4/3;background:var(--panel);display:flex;align-items:center;justify-content:center;padding:10%;overflow:hidden}
.nimg img{max-width:100%;max-height:100%;width:auto;height:auto;transition:transform .9s var(--ease)}
.nimg.photo{padding:0}
.nimg.photo img{width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.ncard:hover .nimg img{transform:scale(1.04)}
.nmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.nmeta .ig{color:var(--muted);display:flex}
.ncard p{margin:0;color:var(--ink2);font-size:15.5px;max-width:48ch}
.ncard:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.nd-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.nd-img{margin:0;background:var(--panel);display:flex;justify-content:center;padding:clamp(32px,6vw,96px)}
.nd-img img{max-height:78vh;width:auto;max-width:100%}
.nd-img.photo{padding:0}
.nd-img.photo img{width:100%;max-height:82vh;object-fit:cover}
.nd-body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) minmax(0,2fr);gap:clamp(24px,4vw,64px);padding-top:clamp(56px,6vw,96px)}
.nd-body aside{display:flex;flex-direction:column;gap:14px;align-items:flex-start;position:sticky;top:110px;align-self:start}
@media (max-width:1000px){.nd-body{grid-template-columns:1fr}.nd-body aside{position:static;flex-direction:row;flex-wrap:wrap}}
.igembed{margin-top:40px;max-width:540px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.igembed iframe{width:100%;height:720px;border:0;display:block}
.nd-nav{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-block:56px;border-top:1px solid var(--line);margin-top:clamp(56px,6vw,96px)}
.nd-nav a{display:flex;flex-direction:column;gap:10px}
.nd-nav a:hover .d4{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn svg{flex:none}
/* ARTICLE (journal) */
.art-head{padding-top:clamp(120px,13vw,170px);max-width:1180px}
.art-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.art-head h1{max-width:20ch}
.standfirst{font-size:clamp(20px,1.8vw,26px);line-height:1.4;letter-spacing:-.02em;color:var(--ink2);max-width:52ch;margin:28px 0 20px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.art-hero{margin:clamp(40px,5vw,72px) 0 0;background:var(--panel)}
.art-hero a{display:flex;justify-content:center;padding:clamp(32px,6vw,96px)}
.art-hero img{max-height:80vh;width:auto;max-width:100%}
.art-hero figcaption{padding-block:14px;font-size:13.5px;color:var(--muted);background:var(--bg)}
.art-hero figcaption .t{font-size:1.15em}
.art-body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) minmax(0,2fr);gap:clamp(24px,4vw,64px);padding-top:clamp(56px,6vw,96px)}
.art-side{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:10px}
.art-side ol{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14.5px;color:var(--ink2)}
.share{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.share a,.share button{border-bottom:1px solid var(--line);padding-bottom:2px}
.share a:hover,.share button:hover{border-color:var(--ink)}
@media (max-width:1000px){.art-body{grid-template-columns:1fr}.art-side{position:static}}
.dateline{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.essay blockquote cite{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-top:16px}
.afig{margin:48px 0}
.afig-in{background:var(--panel);display:flex;justify-content:center;padding:clamp(24px,4vw,56px)}
.afig-in img{max-height:70vh;width:auto;max-width:100%}
.afig figcaption{margin-top:12px;font-size:13.5px;color:var(--muted)}
.afig figcaption b{color:var(--ink);font-weight:500}
.facts{margin:48px 0;border:1px solid var(--line);border-radius:4px;padding:22px 24px;background:var(--paper);max-width:66ch}
.facts dl{margin:14px 0 0}
.facts dl div{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.refs{margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line);max-width:66ch}
.refs ul{margin:12px 0 0;padding-left:18px;color:var(--ink2);font-size:15px;line-height:1.6}
.ncard .nimg{padding:12%}
/* journal additions */
.nimg img,.art-hero:not(.photo) img,.afig-in img{mix-blend-mode:multiply}
.nimg img.clean,.art-hero img.clean,.afig-in img.clean{mix-blend-mode:normal;box-shadow:0 16px 30px -16px rgba(0,0,0,.45)}
.nimg:not(.photo) img{box-shadow:none}
.art-hero.photo>div{display:flex;justify-content:center;background:var(--dark)}
.art-hero.photo img{max-height:82vh;width:auto;max-width:100%}
.art-hero-ba{margin-top:clamp(40px,5vw,72px)}
.art-hero-ba .afig{margin:0}
.steps{list-style:none;margin:28px 0 36px;padding:0;counter-reset:st;border-top:1px solid var(--line);max-width:66ch}
.steps li{counter-increment:st;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(st,decimal-leading-zero);font:500 12px/1.9 var(--mono);color:var(--muted);grid-row:1/3}
.steps b{font-weight:500;font-size:17px;letter-spacing:-.015em}
.steps span{color:var(--ink2);font-size:16px;line-height:1.6}
.svc-cta{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:28px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.svc-read{margin-top:32px;border-top:1px solid var(--line)}
.svc-read .lab{display:block;padding:14px 0 6px}
.svc-read a{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.svc-read a:hover .d4{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.svc-read .d4{font-size:20px}

/* ════════════════════════════════════════════════════════════════════
   DESIGN PROPOSALS — V1 · V2 · V3 · V4
   Same content, same markup, same scripts. Only this layer changes.
   The active proposal is set on <html data-v="1|2|3|4"> by the switch
   in the header (also ?v=2 in the URL). V1 = the base styles above.
     V1 Contemporary  warm grey, Geist + Instrument Serif, pill controls
     V2 Salon         ivory paper, Cormorant Garamond + Jost, centred masthead, mounted works
     V3 Nocturne      dark museum rooms, Bodoni Moda + Inter, works on lit stone
     V4 Index         white Swiss grid, Inter Tight + Plex Mono, numbered hairline grid
   ════════════════════════════════════════════════════════════════════ */

/* switch + toast (all versions) */
.vsw{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.vsw button{min-width:34px;height:34px;padding:0 8px;border-radius:999px;font:500 11.5px/1 var(--mono);letter-spacing:.04em;color:var(--ink2);transition:background .3s,color .3s}
.vsw button:hover{color:var(--ink);background:rgba(127,127,127,.12)}
.vsw button.on{background:var(--ink);color:var(--bg)}
#vtoast{position:fixed;left:50%;top:calc(var(--navh) + 16px);z-index:190;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font:400 14px/1.4 var(--sans);transition:opacity .35s,transform .45s var(--ease);max-width:min(560px,calc(100vw - 32px));text-align:center;box-shadow:0 12px 32px -12px rgba(0,0,0,.4)}
#vtoast b{font-weight:600;margin-right:6px}
#vtoast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.logo span{display:none}.vsw button{min-width:30px;height:32px;padding:0 5px;font-size:11px}.nav-r{gap:6px}}
html[data-v] body{transition:background-color .4s}

/* ───────────────────────── V2 · SALON ───────────────────────── */
html[data-v="2"]{
  --bg:#f4f0e7;--panel:#ebe5d8;--paper:#fcfaf5;--ink:#1c1915;--ink2:#4a443b;--muted:#877f70;--line:#dbd3c2;
  --blue:#1c1915;--dark:#1f1b16;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --mono:"Jost","Helvetica Neue",Arial,sans-serif;
}
@media (min-width:1181px){html[data-v="2"]{--navh:116px}}
html[data-v="2"] body{letter-spacing:0;font-size:16.5px;font-weight:350}
html[data-v="2"] :is(h1,h2,h3){font-family:var(--serif);font-weight:500;letter-spacing:-.012em;line-height:.98}
html[data-v="2"] .d1{font-size:clamp(62px,10.6vw,184px);font-weight:400}
html[data-v="2"] .d2{font-size:clamp(46px,6.4vw,108px);font-weight:400}
html[data-v="2"] .d3{font-size:clamp(34px,3.8vw,58px)}
html[data-v="2"] .d4{font-family:var(--serif);font-size:clamp(25px,2.2vw,32px);font-weight:500;letter-spacing:0}
html[data-v="2"] .t{font-family:var(--serif);font-weight:500;letter-spacing:0}
html[data-v="2"] .lab{font:500 10.5px/1.3 var(--sans);letter-spacing:.2em}
html[data-v="2"] .mono{font-family:var(--sans);letter-spacing:.02em}
html[data-v="2"] .lede,html[data-v="2"] .standfirst{font-family:var(--serif);font-size:clamp(24px,2.1vw,32px);letter-spacing:0;line-height:1.3}
html[data-v="2"] :is(.facts-row b,.count b,.tl-v .y,.big-n,.evc-img .mark,.ev-hero-r .mark,.fbig){font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
html[data-v="2"] .dt-side .artist{font-size:clamp(40px,3.4vw,54px)}
html[data-v="2"] .essay blockquote{font-family:var(--serif)}
html[data-v="2"] .essay p,html[data-v="2"] .prose p{font-size:18px}
/* square, engraved controls */
html[data-v="2"] :is(.btn,.pill,.chip,.seg,.seg button,.sbtn,.search,.nl,.field,.toggle,.dt-tools,.dt-tools button,.dt-tools a,.chapnav a,.hit,.ref,.facts,.svc-cta,.vsw,.vsw button,.x,.burger,.socials a,.hero-ctrl button,.grp,.grp button,.mbar,.room,.sheet,#vtoast,.clist button,.svc-grid .go,.film .go i,.tour .ring,.igembed,.pending,.no-dims){border-radius:0}
html[data-v="2"] .btn{font:500 11.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;min-height:50px;padding:0 26px}
html[data-v="2"] :is(.chip,.seg button,.chapnav a,.toggle){font-size:12.5px;letter-spacing:.06em}
html[data-v="2"] .pill{font:500 10px/1 var(--sans);letter-spacing:.16em}
/* masthead: address · centred name · tools, menu on its own line */
@media (min-width:1181px){
  html[data-v="2"] .nav{background:var(--bg);border-bottom:1px solid var(--line)}
  html[data-v="2"] .nav.solid{background:rgba(244,240,231,.94)}
  html[data-v="2"] .nav .wrap{grid-template-columns:1fr auto 1fr;grid-template-rows:68px 48px;gap:0 24px}
  html[data-v="2"] .nav .wrap::before{content:"Talstrasse 37 · 8001 Zurich · By appointment";grid-column:1;grid-row:1;align-self:center;font:500 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  html[data-v="2"] .logo{grid-column:2;grid-row:1;flex-direction:column;align-items:center;gap:6px;align-self:center}

  W('winter-landscape-with-skaters','Jan van Goyen','Leiden 1596 – The Hague 1656','Winter Landscape with Skaters','Landscape',{o:'front_end/original/5118492868.jpg',t:'front_end/thumb/5118492868.jpg'},{
    date:'Painted circa 1626', year:1626, medium:'Oil on panel', dims:[34.7,52.7], sig:'Signed with the monogram ‘VG’', prov:['Private Collection, France'], lit:['Unpublished'],
    lede:'A previously unknown and unrecorded winter landscape by Jan van Goyen.',
    essay:[
      '#The artist',
      'Jan Josephsz. van Goyen was one of the best and most influential Dutch landscapists of the seventeenth century. From the very beginnings of his career, in the early 1620s, winter landscapes were one of the artist’s favourite subjects. In the period until 1628 we know of some thirty-five winter scenes by him. These early landscapes were strongly influenced by Esaias van de Velde, in whose studio Van Goyen wrapped up his apprenticeship.',
      'In the Flemish tradition of the ‘season iconography’, Van Goyen’s earliest landscapes were often conceived as pendants of summer landscapes. For these pairs the artist initially showed a clear preference for small, round panels, as had been popular among sixteenth-century Flemish artists like Abel and Jacob Grimmer. The rounded format was introduced in the Netherlands by Flemish immigrants and from then on used by early landscapists like Hendrick Avercamp and Esaias van de Velde, and subsequently by Van Goyen. As of 1622, however, Van Goyen also started to use rectangular panels. Some of these were still paired with summer scenes; others were conceived as individual works of art.',
      '#The present panel',
      'The present, hitherto unpublished, panel is a good example of this last category. With fine yet rapid brushstrokes, applying the paint rather thickly in opaque layers, he rendered the various figures engaged in skating and pushing a sleigh on a frozen river which runs from the right foreground to the horizon in the left background. A house with a turret and some gnarled, bare trees closes off the composition in the left foreground. The type of trees seems to have been taken directly from the specimens generally painted by Esaias van de Velde.',
      '>Fine yet rapid brushstrokes, the paint applied rather thickly in opaque layers.',
      'In the middle distance on the right, some farmhouses are located next to a wooden bridge, whereas a single bare tree is silhouetted against the pale, wintry sky. In the present work, Van Goyen is using earthy hues in various shades of brown, reddish-brown and greys. Hence a dating around 1626 seems likely.'
    ],
    discovery:'Aided by infrared reflectography, the monogram typical for Jan van Goyen was revealed. It is painted in brown tones at the bottom of the doorway of the farmhouse. The monogram is made with dark paint (structure visible under the microscope), most likely a carbon-containing pigment mixture, an earth pigment with black.' }),

const IG_PROFILE='https://www.instagram.com/koetsergallery/';
const NEWS = [
  { slug:'from-discovery-to-wall', date:'2026-09-21', cat:'Behind the scenes', tag:'The dealer’s work', service:'collecting',
    title:'From discovery to wall: the life of a painting inside a gallery',
    standfirst:'Between the moment an Old Master painting is found and the moment it hangs in a collection, months or even years of work take place. Here is what happens along the way.',
    photo:{img:{o:'front_end/original/9011329448.jfif',t:'front_end/thumb/9011329448.jfif'},cap:'The gallery, Talstrasse 37, Zurich.'}, works:[], artists:[],
    blocks:[
      {t:'p',x:'Visitors to a gallery see the last step of a long process: a painting on a wall, lit and labelled. What they do not see is the chain of decisions that brought it there. Some of those decisions are made in a saleroom in minutes; others take a year of research, a conservator’s patience and more than one change of mind.'},
      {t:'h',x:'Finding'},
      {t:'p',x:'Old Master paintings reach the market in a handful of ways: through auction, from private collections and estates, from other dealers, and occasionally from institutions deaccessioning works. The best discoveries are often the least obvious. A painting may be catalogued under a vague name, obscured by old varnish, or offered in a small regional sale with a single photograph. Recognising its potential requires an eye trained on thousands of comparable works and a memory for what is missing from an artist’s known oeuvre.'},
      {t:'h',x:'The process, step by step'},
      {t:'steps',items:[
        ['Looking','A first examination, ideally in person: the support, the paint surface, the condition, the back of the panel or canvas, labels, seals and inscriptions.'],
        ['Deciding','An assessment of quality, attribution, condition and history, weighed against what the painting may become once cleaned and researched.'],
        ['Researching','Provenance, literature, comparison with securely attributed works, consultation of specialists and archives.'],
        ['Examining','Where useful, technical study: infrared reflectography, X-radiography, microscopy, dendrochronology for oak panels.'],
        ['Conserving','If needed, careful treatment by a specialist conservator, always documented and reversible.'],
        ['Presenting','The right frame, the right light, and a written catalogue entry that sets out everything that is known.'],
        ['Placing','Finding the collector or museum for whom the painting will matter, and handling the practicalities of the transfer.']]},
      {t:'q',x:'A painting is not only bought and sold. It is looked after, understood and passed on.',by:'On the dealer’s role'},
      {t:'h',x:'Why time matters'},
      {t:'p',x:'Research cannot be rushed. An archive may answer a letter after months; a specialist may want to see the painting in person; a cleaning test may change the picture of what lies beneath. A dealer who owns the painting outright can afford that time, and the result is a work that arrives in a collection with its questions answered, or at least honestly stated.'},
      {t:'h',x:'After the sale'},
      {t:'p',x:'The relationship does not end with the invoice. Collectors return for advice on condition, insurance, loans to exhibitions or the eventual sale of a work. Many of the paintings the gallery has handled over three generations have since entered museums, and each of those journeys began with the same careful first look.'}
    ] },

  { slug:'provenance-reading-the-history-of-ownership', date:'2026-09-14', cat:'Research', tag:'Provenance', service:'research',
    title:'Provenance: reading the history of a painting’s owners',
    standfirst:'Who owned a painting, when, and how it changed hands: provenance is one of the most important, and most misunderstood, parts of an Old Master’s documentation.',
    photo:{img:{o:'front_end/original/9155819600.jfif',t:'front_end/thumb/9155819600.jfif'},cap:'Research at the gallery.'}, works:[], artists:[],
    blocks:[
      {t:'p',x:'A provenance is the history of a work’s ownership, from the artist’s studio to the present day. For a painting made in the 1620s, a complete chain of four centuries is rare. What matters is not perfection but honesty: each link documented where possible, each gap acknowledged.'},
      {t:'h',x:'Where the evidence comes from'},
      {t:'p',x:'The clues are scattered. On the back of a panel or stretcher one may find wax seals, collection stamps, inventory numbers, exhibition labels or the chalk marks of an old sale. Printed sale catalogues, often annotated with buyers’ names and prices, record transactions from the eighteenth century onwards. Probate inventories, dealers’ stock books, photographs in art-historical archives such as the RKD in The Hague, and old exhibition catalogues all add pieces to the puzzle.'},
      {t:'h',x:'Why it matters'},
      {t:'steps',items:[
        ['Authenticity','A painting recorded in a known collection in the seventeenth or eighteenth century carries evidence that supports its attribution.'],
        ['Legal title','A buyer must be certain that the seller has the right to sell. Provenance research is the foundation of that certainty.'],
        ['History','Ownership tells a story of taste: who valued a painter, when, and why a work crossed borders.'],
        ['Responsibility','Works that changed hands in Europe between 1933 and 1945 require particular scrutiny.']]},
      {t:'h',x:'The years 1933–1945'},
      {t:'p',x:'Following the Washington Conference Principles on Nazi-Confiscated Art of 1998, museums and the art trade have given particular attention to paintings whose history passes through those years. Responsible due diligence includes checking databases of lost and stolen art, examining gaps in ownership in that period, and, where a problem is found, working towards a just and fair solution with the heirs of former owners.'},
      {t:'q',x:'A gap in a provenance is not a verdict. An unexplained gap is a question that must be asked.',by:'On due diligence'},
      {t:'h',x:'What a buyer should expect'},
      {t:'p',x:'A serious catalogue entry states the known provenance clearly, distinguishes documented facts from tradition or hypothesis, and lists the literature and exhibitions in which the painting has appeared. When the Winter Landscape by Jan van Goyen came to the gallery, its only recorded owner was a private collection in France: a short provenance, stated as such, for a painting that had been entirely unknown.'},
      {t:'fig',work:'winter-landscape-with-skaters',cap:'A newly discovered panel, with a short and honestly stated provenance.'}
    ] },

  { slug:'attribution-who-painted-it', date:'2026-09-07', cat:'Research', tag:'Attribution', service:'research',
    title:'Who painted it? How attributions are made and tested',
    standfirst:'Behind every name on a label lies an argument. Connoisseurship, documents and science each contribute to it, and none of them works alone.',
    img:'the-beach-at-scheveningen', works:['winter-landscape-with-skaters'], artists:[],
    blocks:[
      {t:'p',x:'Seventeenth-century painters did not always sign their works, workshops produced versions and copies, and later centuries added optimistic names to many pictures. An attribution, “Jan van Goyen” rather than “circle of” or “follower of”, is therefore a conclusion reached from several kinds of evidence.'},
      {t:'h',x:'The trained eye'},
      {t:'p',x:'Connoisseurship remains the starting point: the close comparison of a painting with securely attributed works by the same hand. Specialists look at the handling of paint, the way a sky is built up or a face is modelled, the characteristic types of figures, trees or objects, the palette of a given period. This knowledge is accumulated over decades and shared through catalogues raisonnés, the complete scholarly catalogues of an artist’s work.'},
      {t:'h',x:'Documents'},
      {t:'p',x:'Signatures and monograms, inscriptions, early inventories and sale records can confirm or challenge the eye. So can the art-historical archives that hold photographs of hundreds of thousands of paintings, where a picture can be compared with versions and copies that have passed through the market.'},
      {t:'h',x:'Science'},
      {t:'steps',items:[
        ['Infrared reflectography','Reveals underdrawing and hidden inscriptions beneath the paint surface, as with the monogram on Van Goyen’s Winter Landscape.'],
        ['X-radiography','Shows the structure of the painting, changes of composition and earlier images beneath the visible one.'],
        ['Dendrochronology','For paintings on oak panel, the growth rings of the wood give the earliest possible felling date of the tree, and so a date after which the panel was used.'],
        ['Paint analysis','Microscopic samples identify pigments and binders. A pigment invented after the painter’s death can rule out an attribution.']]},
      {t:'fig',work:'winter-landscape-with-skaters',cap:'Infrared reflectography revealed the monogram typical of Jan van Goyen on this panel.'},
      {t:'q',x:'Science rarely proves who painted a picture. It is superb at proving who could not have.',by:'On technical examination'},
      {t:'h',x:'Honest labels'},
      {t:'p',x:'The vocabulary of attribution is precise. “Studio of”, “circle of”, “follower of” and “after” each say something different about how close a painting stands to the master. A trustworthy catalogue entry uses these terms carefully, and explains the reasoning behind the name it gives.'},
      {t:'refs',items:['RKD – Netherlands Institute for Art History, The Hague: image and documentation archives for Netherlandish art.']}
    ] },

  { slug:'cleaning-an-old-master', date:'2026-08-31', cat:'Conservation', tag:'Conservation', service:'conservation',
    title:'What really happens when an Old Master is cleaned',
    standfirst:'Yellowed varnish can turn a silver sky brown and flatten a whole landscape. Cleaning is one of the most delicate, and most rewarding, interventions a painting can receive.',
    ba:true, works:[], artists:[],
    blocks:[
      {t:'p',x:'Most Old Master paintings were finished with a varnish of natural resin, which protected the paint and saturated its colours. Over time these varnishes oxidise, yellow and darken, and they gather dirt. A painting that has not been treated for a century may look warm, brown and flat, whatever its original colours.'},
      {t:'h',x:'Before touching anything'},
      {t:'p',x:'A conservator begins by looking: under ordinary light, raking light that reveals the texture of the surface, and ultraviolet light, under which old varnish and later retouchings fluoresce differently from original paint. The condition of the support is checked too, whether the joins of a panel are sound or a canvas has been lined in the past. Everything is photographed and recorded.'},
      {t:'h',x:'The cleaning itself'},
      {t:'p',x:'Discoloured varnish is removed with carefully chosen solvents, tested first on tiny areas at the edges of the painting. The conservator works in small sections with cotton swabs, watching constantly to ensure that only the varnish, and never the original paint, is affected. Old retouchings that have discoloured are removed at the same time.'},
      {t:'ba'},
      {t:'q',x:'The aim is not to make a painting look new, but to let it look like itself again.',by:'On the ethics of cleaning'},
      {t:'h',x:'Principles'},
      {t:'steps',items:[
        ['Minimal intervention','Do only what the painting needs, and nothing that is not necessary.'],
        ['Reversibility','Every material added, from retouching paint to the new varnish, must be removable in the future without harming the original.'],
        ['Documentation','Photographs and a written report record the condition before, during and after treatment.'],
        ['Respect for age','Losses are retouched only within their own boundaries; the natural ageing of a four-hundred-year-old surface is not disguised.']]},
      {t:'h',x:'The result'},
      {t:'p',x:'After cleaning, a new, stable varnish is applied, and small losses are retouched with reversible materials. The transformation can be striking: skies regain their blues and silvers, distances open up, details lost under the varnish reappear. For a dealer, a well-judged cleaning can also resolve questions of attribution and quality that no photograph could answer.'}
    ] },

  { slug:'why-trust-a-dealer', date:'2026-08-24', cat:'Behind the scenes', tag:'Trust', service:'advisory',
    title:'Why buy from a dealer? The guarantees behind an Old Master',
    standfirst:'Buying a four-hundred-year-old painting is an act of trust. Here is what stands behind that trust, and the questions every collector is entitled to ask.',
    photo:{img:{o:'front_end/original/3605048388.jpg',t:'front_end/thumb/3605048388.jpg'},cap:'David H. Koetser is one of the eight founder members of TEFAF Maastricht.'}, works:[], artists:[],
    blocks:[
      {t:'p',x:'A collector can buy an Old Master painting at auction, privately, or from a dealer. Each route has its merits. What distinguishes a dealer is that the painting has already been bought, studied and, where necessary, restored at the dealer’s own risk, and that the dealer stands behind what is said about it.'},
      {t:'h',x:'Questions worth asking'},
      {t:'steps',items:[
        ['Attribution','How is the painting described, and on what evidence? Has it been seen by specialists?'],
        ['Condition','What treatment has it received, when and by whom? Is there a condition report?'],
        ['Provenance','What is known of its history, and have the necessary checks been made?'],
        ['Documentation','Will the invoice state the attribution, date, medium and dimensions clearly?'],
        ['After-sales','Who will advise on insurance, loans, conservation or a future sale?']]},
      {t:'h',x:'Vetting'},
      {t:'p',x:'At the leading fairs, every object on every stand is examined before the opening by committees of independent experts, including museum curators, scholars and conservators. At TEFAF Maastricht, the fair David H. Koetser helped to found, paintings are checked for attribution, condition and description, and works that do not meet the committee’s standards are removed from the stand.'},
      {t:'q',x:'A reputation built over three generations is only as good as the next catalogue entry.',by:'On the dealer’s responsibility'},
      {t:'h',x:'Professional associations'},
      {t:'p',x:'Dealers’ associations set codes of conduct for their members. The gallery is a member of the Swiss art trade association (KHVS / SADA) and a Friend of CODART, the international network of curators of Dutch and Flemish art.'},
      {t:'h',x:'The museum test'},
      {t:'p',x:'Perhaps the strongest guarantee is the judgement of museums themselves. Paintings handled by the Koetser family over three generations are today in more than sixty museums and public collections, from the J. Paul Getty Museum and the National Gallery of Art in Washington to the Rijksmuseum, the Louvre and the Kunsthaus Zurich. Each of those acquisitions passed the scrutiny of curators, conservators and acquisition committees.'},
      {t:'fig',work:'chestnuts-on-a-ledge',cap:'Adriaen Coorte, a painter whose work the gallery has also championed in exhibitions.'}
    ] },

  { slug:'valuation-insurance-loans-probate', date:'2026-08-17', cat:'Collecting guide', tag:'Valuation', service:'advisory',
    title:'One painting, several values: insurance, probate and museum loans',
    standfirst:'A valuation always answers a specific question. Understanding which question is being asked is the first step to getting a useful answer.',
    photo:{img:{o:'front_end/original/302282786.jfif',t:'front_end/thumb/302282786.jfif'},cap:'Advisory work at the gallery.'}, works:[], artists:[],
    blocks:[
      {t:'p',x:'Collectors are often surprised to learn that the same painting can carry different values on the same day. This is not inconsistency. Each valuation serves a different purpose and follows different rules.'},
      {t:'h',x:'Different purposes'},
      {t:'steps',items:[
        ['Insurance','A replacement value: what it would cost to acquire a comparable work of similar quality and condition in the current market, often including the costs of doing so.'],
        ['Probate and succession','A fair market value, usually the price that would be agreed between a willing buyer and a willing seller, as tax and inheritance authorities require.'],
        ['Division of a collection','A consistent basis across many works, so that heirs or partners can share a collection fairly.'],
        ['Museum loans','An agreed value for the period of the loan, which determines the insurance or state indemnity covering the painting while it travels and hangs.']]},
      {t:'h',x:'What a valuation rests on'},
      {t:'p',x:'A credible valuation draws on the attribution and condition of the painting, its subject, size and quality within the artist’s work, its provenance and exhibition history, and above all on comparable sales, public and private. It is a written, reasoned document, not a figure given in passing.'},
      {t:'q',x:'Ask not only “what is it worth?” but “worth for what?”',by:'On valuation'},
      {t:'h',x:'Lending to an exhibition'},
      {t:'p',x:'When a museum asks to borrow a painting, the owner receives a loan agreement, a facility report describing the museum’s security and climate conditions, and a condition report made before and after the loan. Paintings on panel are particularly sensitive to changes in humidity and are usually accompanied by a courier. Lending contributes to scholarship and to a painting’s history; it should be done with care.'}
    ] },

  { slug:'moving-an-old-master', date:'2026-08-10', cat:'Collecting guide', tag:'Logistics', service:'logistics',
    title:'Moving an Old Master: crates, climate and export licences',
    standfirst:'A four-hundred-year-old oak panel reacts to every change in humidity. Moving it across a room, a border or an ocean requires planning of a different order.',
    photo:{img:{o:'front_end/original/389167565.jfif',t:'front_end/thumb/389167565.jfif'},cap:'Logistics.'}, works:[], artists:[],
    blocks:[
      {t:'p',x:'Paintings are more fragile than they look. Wood swells and shrinks with humidity, canvas slackens and tightens, old paint and ground layers are brittle. The journey is often the riskiest moment in a painting’s life, which is why fine-art logistics has become a specialised profession.'},
      {t:'h',x:'Packing'},
      {t:'p',x:'For anything more than a short local move, paintings travel in purpose-built crates: insulated to buffer changes in temperature, lined to absorb shock and vibration, and sized so that the painting cannot move inside. Panels are often packed in a sealed inner case that keeps the surrounding humidity stable. Frames may travel with the painting or separately.'},
      {t:'h',x:'Transport'},
      {t:'p',x:'Specialist fine-art shippers use climate-controlled vehicles with air-ride suspension, and for air freight arrange supervision on the tarmac. Important works travel with a courier who stays with the painting from door to door. On arrival, a crate is left to acclimatise for a day before it is opened.'},
      {t:'q',x:'The best journey is the one the painting does not notice.',by:'On fine-art transport'},
      {t:'h',x:'Paperwork'},
      {t:'steps',items:[
        ['Export licences','Many countries protect their cultural heritage. In the European Union, paintings over fifty years old above a set value need an export licence to leave the EU; several member states apply their own national rules as well.'],
        ['Switzerland','Movements of cultural property are governed by the Federal Act on the International Transfer of Cultural Property, which sets out due-diligence duties for the trade.'],
        ['Customs','Temporary admission for fairs and exhibitions, import VAT and customs declarations each have their own procedures and deadlines.'],
        ['Insurance','Nail-to-nail cover, from the moment the painting leaves its wall until it hangs on the next one.']]},
      {t:'p',x:'None of this is visible to the collector when a painting arrives, and that is the point. Good logistics, like good conservation, leaves no trace except a painting in the same condition as when it left.'}
    ] },
  { slug:'claesz-smoke-and-transience', date:'2026-09-24', cat:'Essay', tag:'Pieter Claesz',
    title:'Smoke and transience: Pieter Claesz and the Haarlem tobacco still life',
    standfirst:'Tobacco was still a novelty in the Dutch Republic when Haarlem painters turned the smoker’s table into a subject of its own. Pieter Claesz made it one of the most distinctive themes of Dutch still life.',
    img:'a-toebackje', works:['a-toebackje'], artists:['Pieter Claesz'],
    blocks:[
      {t:'p',x:'Few objects were as new to seventeenth-century Holland as the clay pipe. Tobacco, brought from the Americas, spread through the Dutch Republic in the first decades of the century, and within a generation it had found its way into painting. In Haarlem, Pieter Claesz turned the smoker’s table into a subject of its own: the <i>toebackje</i>, or tobacco still life.'},
      {t:'h',x:'A Haarlem speciality'},
      {t:'p',x:'Born in Berchem, near Antwerp, around 1596, Claesz had settled in Haarlem by the early 1620s and remained there until his death in 1660. With Willem Claesz Heda he shaped what art historians call the “monochrome banketje”: a small number of objects seen from a low viewpoint, a restricted palette of greys, browns and olive greens, and a single light that binds everything into one tonal harmony. His son, Nicolaes Berchem, would become one of the leading Italianate landscape painters of the next generation.'},
      {t:'q',x:'Colour gives way to tone: a handful of objects, one light, and the slow gradations between them.',by:'On the monochrome still life'},
      {t:'h',x:'The objects on the table'},
      {t:'p',x:'A toebackje gathers the implements of smoking. Long white clay pipes, of the kind produced in growing numbers by Dutch pipe-makers, lie beside a paper of tobacco. A brazier or small chafing dish holds glowing embers to light them; slivers of wood tipped with sulphur served as matches. A glass, often a <i>berkemeier</i> with its wide, funnel-shaped bowl on a stem set with prunts, completes the ensemble. Each material asks for a different touch: the dry, chalky surface of fired clay, the reflections on glass, the grey of cooling ash.'},
      {t:'fig',work:'a-toebackje',cap:'The objects of the smoker’s table, arranged in a single, low light.'},
      {t:'h',x:'Pleasure and vanitas'},
      {t:'p',x:'Smoking was read ambivalently by Claesz’s contemporaries. It stood for sociability and pleasure, and could embody the senses of taste and smell. Moralists also saw in rising smoke an image of the brevity of human life, a thought close to the vanitas still lifes Claesz painted in the same years. The toebackje holds both readings at once, and much of its appeal lies in that quiet uncertainty.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Pieter Claesz, Berchem c. 1596 – Haarlem 1660'],['Active','Haarlem, from the early 1620s'],['Known for','Monochrome breakfast pieces, vanitas and tobacco still lifes'],['Circle','Willem Claesz Heda; his son Nicolaes Berchem']]},
      {t:'refs',items:['Pieter Biesboer et al., <i>Pieter Claesz: Master of Haarlem Still Life</i>, exhibition catalogue, Haarlem, Zurich and Washington, 2004–05.']}
    ] },

  { slug:'van-goyen-early-winters', date:'2026-09-17', cat:'Research', tag:'Jan van Goyen',
    title:'Before the tonal landscape: Jan van Goyen’s early winter scenes',
    standfirst:'A previously unrecorded panel of around 1626 sheds light on the first decade of one of the most influential Dutch landscape painters, and on a monogram that only infrared could reveal.',
    img:'winter-landscape-with-skaters', works:['winter-landscape-with-skaters','the-beach-at-scheveningen'], artists:['Jan van Goyen'],
    blocks:[
      {t:'p',x:'Jan van Goyen (Leiden 1596 – The Hague 1656) is best known for the “tonal” landscapes of his maturity: low horizons, vast skies and a palette reduced to browns, greys and greens. His beginnings were different. In the early 1620s, fresh from his training with Esaias van de Velde in Haarlem, he painted lively, colourful scenes crowded with figures, and among them winter landscapes held a special place.'},
      {t:'h',x:'Thirty-five winters'},
      {t:'p',x:'Some thirty-five winter scenes by Van Goyen are known from the years up to 1628. They belong to a Flemish tradition of season iconography, in which winter and summer were conceived as pendants. At first Van Goyen favoured small round panels for such pairs, a format popular with sixteenth-century Flemish painters such as Abel and Jacob Grimmer, brought north by Flemish immigrants and taken up by Hendrick Avercamp and Esaias van de Velde.'},
      {t:'p',x:'From 1622 Van Goyen also used rectangular panels. Some were still paired with summer scenes; others were conceived as independent works of art. The Winter Landscape with Skaters belongs to this second group. Skaters and a sleigh move along a frozen river that runs from the right foreground to the horizon on the left; a house with a turret and gnarled, bare trees close the composition on the left, their forms taken almost directly from Esaias van de Velde.'},
      {t:'fig',work:'winter-landscape-with-skaters',cap:'Painted around 1626, previously unknown and unrecorded.'},
      {t:'q',x:'Earthy hues in various shades of brown, reddish-brown and grey already announce the painter of the following decade.',by:'On the dating of the panel'},
      {t:'h',x:'Reading a hidden monogram'},
      {t:'p',x:'Infrared reflectography records how a painting reflects near-infrared light. Many upper paint layers become partly transparent at these wavelengths, while carbon-containing materials absorb the light and appear dark. On this panel it revealed the monogram typical of Van Goyen, painted in brown tones at the bottom of the doorway of the farmhouse. Under the microscope the monogram shows the structure of a dark paint, most likely an earth pigment mixed with black.'},
      {t:'h',x:'Towards the dunes and the sea'},
      {t:'p',x:'Within a few years Van Goyen’s palette narrowed and his skies grew. Beach views such as The Beach at Scheveningen show where this path led: the same attention to figures at work, now set under a wide, luminous sky. Van Goyen was also the father-in-law of Jan Steen, who married his daughter Margriet in 1649.'},
      {t:'fig',work:'the-beach-at-scheveningen',cap:'The later Van Goyen: low horizon and open sky.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Jan van Goyen, Leiden 1596 – The Hague 1656'],['Teacher','Esaias van de Velde, Haarlem'],['Winter scenes to 1628','Some thirty-five known'],['Technique','Infrared reflectography, microscopy']]},
      {t:'refs',items:['Hans-Ulrich Beck, <i>Jan van Goyen 1596–1656. Ein Oeuvreverzeichnis</i>, 1972–1991.']}
    ] },

  { slug:'jan-steen-family-tavern-theatre', date:'2026-09-10', cat:'Artist focus', tag:'Jan Steen',
    title:'Jan Steen: a painter between family, tavern and theatre',
    standfirst:'Brewer’s son, innkeeper and son-in-law of Jan van Goyen, Jan Steen turned the everyday life of the Dutch household into comedy, and gave the Dutch language an expression.',
    img:'the-meal-of-eggs', works:['the-meal-of-eggs'], artists:['Jan Steen'],
    blocks:[
      {t:'p',x:'In Dutch, a messy household is still called “een huishouden van Jan Steen”, a Jan Steen household. Few painters have left such a mark on their own language. Yet behind the image of the cheerful chronicler of disorder stands one of the most inventive storytellers of the Golden Age.'},
      {t:'h',x:'A life between cities'},
      {t:'p',x:'Steen was born in Leiden in 1626, the son of a brewer. In 1648 he was among the first members of the city’s newly founded Guild of Saint Luke, and the following year he married Margriet van Goyen, daughter of the landscape painter Jan van Goyen. He worked in The Hague, leased a brewery in Delft in the mid-1650s, lived in Warmond and then in Haarlem during the 1660s, before returning to Leiden, where in 1672 he obtained permission to keep an inn. He died there in 1679.'},
      {t:'fig',work:'the-meal-of-eggs',cap:'The table, the household and its small dramas were among Steen’s favourite subjects.'},
      {t:'h',x:'The stage of daily life'},
      {t:'p',x:'Steen’s scenes are often built like theatre. Figures turn towards us as if to an audience; gestures are clear; objects carry meaning. Proverbs and moral sayings, familiar to his public, run beneath the humour. The meal, the family at table and the simple foods of the Dutch kitchen recur throughout his work, as settings for affection, excess or gentle satire.'},
      {t:'q',x:'The humour is the entry point; the observation of people is what keeps us looking.',by:'On Steen’s genre scenes'},
      {t:'p',x:'Among his favourite themes was the doctor’s visit to a lovesick young woman, a subject he painted many times and which later painters, Godfried Schalcken among them, took up in their own manner.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Jan Steen, Leiden 1626 – 1679'],['Guild','Among the first members of the Leiden Guild of Saint Luke, 1648'],['Family','Married Margriet van Goyen, daughter of Jan van Goyen, 1649'],['Cities','Leiden, The Hague, Delft, Warmond, Haarlem']]}
    ] },

  { slug:'the-doctors-visit-iconography', date:'2026-09-03', cat:'Iconography', tag:'Godfried Schalcken',
    title:'The doctor’s visit: love-sickness in Dutch genre painting',
    standfirst:'A pale young woman, an anxious household and a physician in old-fashioned dress: one of the most popular subjects of Dutch genre painting, from Jan Steen to Godfried Schalcken.',
    img:'the-doctors-visit', works:['the-doctors-visit'], artists:['Godfried Schalcken','Jan Steen'],
    blocks:[
      {t:'p',x:'Few subjects amused the Dutch public of the seventeenth century as much as the doctor’s visit. A young woman lies listless in a chair or bed; a physician takes her pulse or holds up a flask of urine to the light; relatives look on. The diagnosis, well known to every viewer, is rarely medical. The patient is lovesick, or, in some versions, expecting a child.'},
      {t:'h',x:'A comedy of manners'},
      {t:'p',x:'The doctors in these scenes are often dressed in costumes that were already out of date, recalling the quack physicians of the popular stage. The humour lies in the gap between their learned gestures and the obvious cause of the illness. Details such as a letter, a portrait of a lover or a small symbolic object often give the answer before the doctor does. Jan Steen painted the subject many times and made it one of the signature themes of Dutch genre painting.'},
      {t:'fig',work:'the-doctors-visit',cap:'Godfried Schalcken’s treatment of a favourite Dutch subject.'},
      {t:'h',x:'Godfried Schalcken, painter of refinement'},
      {t:'p',x:'Godfried Schalcken (Made, near Breda 1643 – The Hague 1706) trained first with Samuel van Hoogstraten in Dordrecht and then with Gerrit Dou in Leiden, the master of the <i>fijnschilders</i>, the “fine painters” known for their smooth, minutely finished surfaces. Schalcken became famous for his candlelit scenes and for the polish of his handling, and he worked for some years in England in the 1690s before settling in The Hague.'},
      {t:'q',x:'Where Steen makes the doctor’s visit a farce, the fijnschilders make it a study of light, fabric and quiet expression.',by:'On two ways of treating one subject'},
      {t:'p',x:'Compared with Steen’s boisterous versions, Schalcken’s approach to such subjects favours restraint: a small cast, precise description of materials and a light that isolates the protagonists. The joke remains, but it is told in a lower voice.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Godfried Schalcken, Made 1643 – The Hague 1706'],['Teachers','Samuel van Hoogstraten; Gerrit Dou'],['Known for','Candlelit scenes, fine finish, portraits'],['Subject','The doctor’s visit, or love-sickness']]}
    ] },

  { slug:'coorte-and-the-middelburg-still-life', date:'2026-08-27', cat:'Artist focus', tag:'Adriaen Coorte',
    title:'Adriaen Coorte and the still life in Middelburg',
    standfirst:'A handful of chestnuts, a few strawberries, a stone ledge: the small, luminous still lifes of Adriaen Coorte close a century of still-life painting in Zeeland.',
    img:'chestnuts-on-a-ledge', works:['chestnuts-on-a-ledge','summer-winter','allegory-of-painting'], artists:['Adriaen Coorte','Christoffel van den Berghe','Karel Slabbaert'],
    blocks:[
      {t:'p',x:'Almost nothing is known of Adriaen Coorte’s life. His dated works span the years around 1683 to 1707, and he seems to have spent his career in Middelburg, the capital of Zeeland. What survives is a body of small paintings of astonishing concentration: a few strawberries, gooseberries, asparagus, shells or chestnuts, set on a stone ledge against a dark background.'},
      {t:'h',x:'A Zeeland tradition'},
      {t:'p',x:'Middelburg had been one of the cradles of Dutch still life. Ambrosius Bosschaert the Elder worked there in the early seventeenth century, and around him grew a circle of flower and fruit painters, including his brother-in-law Balthasar van der Ast and Christoffel van den Berghe. Karel Slabbaert also died in Middelburg. Coorte, working at the end of the century, took this tradition to its most reduced form.'},
      {t:'fig',work:'summer-winter',cap:'Christoffel van den Berghe, who worked in Middelburg in Bosschaert’s circle, also painted the seasons.'},
      {t:'h',x:'The art of leaving out'},
      {t:'p',x:'Coorte’s compositions rarely contain more than a few objects. There is no tablecloth, no costly vessel, no narrative. The light falls from one side, the stone ledge is often chipped, and every fruit is given its own weight and texture. The effect, for a modern eye, can be startlingly contemporary.'},
      {t:'fig',work:'chestnuts-on-a-ledge',cap:'Adriaen Coorte, Chestnuts on a Ledge.'},
      {t:'q',x:'A few chestnuts on a worn stone ledge become a complete world.',by:'On Coorte’s small still lifes'},
      {t:'h',x:'Rediscovery'},
      {t:'p',x:'Coorte was largely forgotten until the twentieth century, when the research of the art historian Laurens J. Bol brought him back into view. Museums followed: his Still Life with Asparagus and Red Currants is today in the National Gallery of Art, Washington. In 2008 the Mauritshuis in The Hague devoted an exhibition to the painter, co-curated by David Koetser.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Adriaen Coorte, active Middelburg c. 1683 – 1707'],['Subjects','Fruit, vegetables and shells on a stone ledge'],['Tradition','Middelburg still life: Bosschaert, Van der Ast, Van den Berghe'],['Exhibition','Mauritshuis, The Hague, 2008']]}
    ] },

  { slug:'molenaer-music-by-candlelight', date:'2026-08-20', cat:'Artist focus', tag:'Jan Miense Molenaer',
    title:'Music by candlelight: Jan Miense Molenaer in Haarlem',
    standfirst:'Children making music, a single flame, and the Haarlem painter who shared his life and studio world with Judith Leyster.',
    img:'a-boy-and-a-girl-playing-music', works:['a-boy-and-a-girl-playing-music'], artists:['Jan Miense Molenaer'],
    blocks:[
      {t:'p',x:'Jan Miense Molenaer (Haarlem c. 1610 – 1668) belongs to the generation that made Haarlem one of the most inventive centres of Dutch genre painting in the 1630s. His scenes of children, musicians and village life share the energy of Frans Hals’s portraits and the humour of the Haarlem stage.'},
      {t:'h',x:'Molenaer and Leyster'},
      {t:'p',x:'In 1636 Molenaer married Judith Leyster, one of the very few women admitted as a master to the Haarlem Guild of Saint Luke and a painter of great originality in her own right. The two worked on closely related subjects, including merry companies and musicians, and their works have at times been confused. The couple spent a number of years in Amsterdam before returning to the Haarlem area.'},
      {t:'fig',work:'a-boy-and-a-girl-playing-music',cap:'Jan Miense Molenaer, A Boy and a Girl playing Music by Candlelight.'},
      {t:'h',x:'Night scenes'},
      {t:'p',x:'Candlelit scenes became fashionable in the Dutch Republic in the 1620s, in the wake of the Utrecht painters who had studied the work of Caravaggio and his followers in Rome. A single flame allowed a painter to model faces and hands with strong contrasts and to create an intimate, enclosed space. Genre painters in Haarlem and Leiden adapted the device to scenes of everyday life.'},
      {t:'q',x:'A single flame turns a scene of children playing into a small theatre of light.',by:'On Molenaer’s nocturnes'},
      {t:'h',x:'Music and meaning'},
      {t:'p',x:'Music-making carried many associations for seventeenth-century viewers: harmony and concord, courtship, education, and the fleeting nature of pleasure, since sound fades as soon as it is made. Scenes of children playing instruments could be read as charming observation, as gentle moral lessons, or as both.'},
      {t:'facts',title:'At a glance',rows:[['Artist','Jan Miense Molenaer, Haarlem c. 1610 – 1668'],['Married','Judith Leyster, 1636'],['Known for','Genre scenes, children and musicians, merry companies'],['Context','Haarlem genre painting; candlelight scenes after the Utrecht painters']]}
    ] }
];

  if(t+(h-1-b)+l+(w-1-r)<2) return '';
  t=Math.min(h-1,t+1); l=Math.min(w-1,l+1); b=Math.max(t,b-1); r=Math.max(l,r-1);   /* shave one more pixel of anti-aliasing */
  const f=1/sc, cw=Math.round((r-l+1)*f), ch=Math.round((b-t+1)*f), out=document.createElement('canvas'); out.width=cw; out.height=ch;
  out.getContext('2d').drawImage(el,Math.round(l*f),Math.round(t*f),cw,ch,0,0,cw,ch);
  return out.toDataURL('image/jpeg',.92);
}
function trim(img){
  if(img.dataset.trimmed) return; img.dataset.trimmed='1';
  if(img.closest('.slide.cover,.film,.photo,.plx,.evc-img,.ev-hero-r,.tour,.gal,.insitu,.svc-img,.hit')) return;   /* photographs, not paintings */
  const src=img.src;
  const done=u=>{ if(u) img.src=u; img.classList.add('clean'); const pc=img.closest('.piece'); if(pc) pc.classList.add('clean'); };
  if(src in TRIMMED){ if(TRIMMED[src]!==null) done(TRIMMED[src]); return; }
  try{ const u=whiteBox(img); TRIMMED[src]=u; done(u); return; }catch(e){}
  const c=new Image(); c.crossOrigin='anonymous';
  c.onload=()=>{ try{ const u=whiteBox(c); TRIMMED[src]=u; done(u); }catch(e){ TRIMMED[src]=null; } };
  c.onerror=()=>{ TRIMMED[src]=null; };
  c.src=src+(src.includes('?')?'&':'?')+'cors=1';
}

function bindHang(root){
  root.querySelectorAll('[data-hang]').forEach(h=>{
    const prog=h.nextElementSibling.querySelector('i');
    const upd=()=>{ const max=h.scrollWidth-h.clientWidth, vis=Math.min(1,h.clientWidth/h.scrollWidth), p=max>0?h.scrollLeft/max:0; prog.style.width=(vis*100)+'%'; prog.style.left=(p*(1-vis)*100)+'%'; };
    h.addEventListener('scroll',upd,{passive:true}); setTimeout(upd,300); h.querySelectorAll('img').forEach(i=>i.addEventListener('load',upd));
    h.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return; DRAG={h,sx:e.clientX,sl:h.scrollLeft,moved:false}; });
    h.addEventListener('click',e=>{ if(h.dataset.moved==='1'){ e.preventDefault(); e.stopPropagation(); h.dataset.moved=''; } },true);
    h.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ const max=h.scrollWidth-h.clientWidth; if((e.deltaY>0&&h.scrollLeft<max-1)||(e.deltaY<0&&h.scrollLeft>0)){ e.preventDefault(); h.scrollLeft+=e.deltaY; } } },{passive:false});
  });
}
