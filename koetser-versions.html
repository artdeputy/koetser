/* ═══════════════════════════════════════════════════════════════════════════
   VIEWING ROOM — RULES (for the developers)
   ───────────────────────────────────────────────────────────────────────────
   Background : one photograph of an empty gallery wall (no furniture, no person), 1536 × 1024 px.
   Visitor    : a separate cut-out of a man, 1.80 m tall (hair to sole), transparent WebP.
   No frame   : the painting is shown bare, exactly as photographed, with a soft shadow.

   Calibration of the wall photo (pixels of the photo):
     WALL_BASE = 742   y of the line where wall meets floor
     HORIZON   = 463   y of the eye level (camera height 170 cm)
     CENTRE_X  = 768   x of the optical centre = centre of the wall
     K = (WALL_BASE − HORIZON) / 170 = 1.641 px per cm, on the wall plane
     CAMERA_D  = 700   cm from the camera to the wall (assumed standard wide-angle shot)

   1. The painting is always centred horizontally on the wall (CENTRE_X).
   2. Its centre hangs at 150 cm from the floor; a tall painting is raised so its bottom edge stays 60 cm above the floor.
   3. Painting size on screen = its real size in cm × K. If the image is portrait and the dimensions
      read as landscape (or the reverse), height and width are swapped to match the image.
   4. The visitor stands 2 m in front of the wall and 1 m to the left of the painting's left edge
      (measured to the centre of his body). Being closer to the camera, he is enlarged by
      CAMERA_D / (CAMERA_D − 200) = 1.4, and his feet sit lower in the photo, following the perspective.
   5. Framing: the view zooms onto painting + visitor. The smaller the painting, the closer the view (max × 2.4);
      the bigger the painting, the wider the view (never less than the full photo).
   6. If the painting does not fit under the ceiling (top edge above y = 60), a notice says so.
   ═══════════════════════════════════════════════════════════════════════════ */
const VIEWING_ROOM = { src:IMG_GALLERY, W:1536, H:1024, WALL_BASE:742, HORIZON:463, CENTRE_X:768, CEILING:60, CAMERA_D:700,
  VISITOR:{ src:IMG_VISITOR, w:299, h:900, heightCm:180, distFromWallCm:200, leftOfPaintingCm:100 } };
function drawRoom(item, img){
  const el=document.getElementById('roomEl'); if(!el) return;
  const R=VIEWING_ROOM, V=R.VISITOR, K=(R.WALL_BASE-R.HORIZON)/170;
  let [h,wd]=item.dims;                                   // as entered: height × width (cm)
  if(img.naturalWidth){ const imgLandscape=img.naturalWidth>img.naturalHeight; if(imgLandscape!==(wd>h)) [h,wd]=[wd,h]; }   // rule 3
  const pw=wd*K, ph=h*K;
  const centreCm=Math.max(150, h/2+60);                   // rule 2
  const cx=R.CENTRE_X, cy=R.WALL_BASE-centreCm*K;         // rule 1
  const box=[cx-pw/2, cy-ph/2, cx+pw/2, cy+ph/2];
  const tooBig = box[1] < R.CEILING || pw > R.W-40;       // rule 6
  /* rule 4: visitor 2 m in front of the wall, 1 m left of the painting */
  const s=R.CAMERA_D/(R.CAMERA_D-V.distFromWallCm);
  const wallX=box[0]-V.leftOfPaintingCm*K;                // his position projected on the wall
  const manX=R.CENTRE_X+(wallX-R.CENTRE_X)*s;             // perspective from the optical centre
  const feetY=R.HORIZON+(R.WALL_BASE-R.HORIZON)*s;
  const manH=V.heightCm*K*s, manW=manH*V.w/V.h;
  const man=[manX-manW/2, feetY-manH, manX+manW/2, feetY];
  if(!el.querySelector('.stage')){
    el.innerHTML=`<div class="stage"><img class="bg" src="${R.src}" alt="An empty gallery wall"><div class="piece bare"><img alt=""></div><div class="mshadow"></div><img class="man" src="${V.src}" alt="A visitor, 1.80 m tall"></div><div class="readout"></div><div class="toobig" hidden>This painting is too large to show at true scale on this wall.</div>`;
  }
  const st=el.querySelector('.stage'), pc=el.querySelector('.piece'), mi=el.querySelector('.man'), sh=el.querySelector('.mshadow');
  Object.assign(pc.style,{left:box[0]+'px',top:box[1]+'px',width:pw+'px',height:ph+'px'});
  pc.querySelector('img').src=img.currentSrc||img.src; pc.classList.toggle('clean',img.classList.contains('clean'));
  Object.assign(mi.style,{left:man[0]+'px',top:man[1]+'px',width:manW+'px',height:manH+'px'});
  Object.assign(sh.style,{left:(man[0]-manW*.1)+'px',top:(feetY-14)+'px',width:(manW*1.2)+'px',height:'26px'});
  /* rule 5: framing */
  const pad=50*K, gx0=Math.min(box[0],man[0])-pad, gx1=Math.max(box[2],man[2])+pad, gy0=Math.min(box[1],man[1])-pad, gy1=Math.min(R.H,feetY+pad);
  const z=Math.max(1,Math.min(2.4,R.W/(gx1-gx0),R.H/(gy1-gy0)));
  const vw=R.W/z, vh=R.H/z, vx=Math.min(Math.max((gx0+gx1)/2-vw/2,0),R.W-vw), vy=Math.min(Math.max((gy0+gy1)/2-vh/2,0),R.H-vh);
  st.style.transform=`scale(${el.clientWidth/R.W*z}) translate(${-vx}px,${-vy}px)`;
  el.querySelector('.readout').innerHTML=`<b>${h} × ${wd} cm</b><span class="muted">${frac(h/2.54)} × ${frac(wd/2.54)} in · height × width</span><br><span class="muted">Centre at ${Math.round(centreCm)} cm, visitor 1.80 m.</span>`;
  el.querySelector('.toobig').hidden=!tooBig;
}

const Z={s:1,x:0,y:0,min:1,iw:0,ih:0};
function openZoom(src,alt){
  const zo=document.getElementById('zoom'), zi=document.getElementById('zImg');
  zi.src=src; document.getElementById('zMiniImg').src=src; zi.alt=alt||'';
  zo.classList.add('on'); document.body.style.overflow='hidden';
  const fit=()=>{ const v=document.getElementById('zView'); Z.iw=zi.naturalWidth; Z.ih=zi.naturalHeight; if(!Z.iw) return; Z.min=Math.min(v.clientWidth/Z.iw,v.clientHeight/Z.ih)*0.9; Z.s=Z.min; Z.x=(v.clientWidth-Z.iw*Z.s)/2; Z.y=(v.clientHeight-Z.ih*Z.s)/2; applyZ(); };
  if(zi.complete&&zi.naturalWidth) fit(); else zi.onload=fit;
  document.getElementById('zPct').onclick=fit;
}
function applyZ(){
  const zi=document.getElementById('zImg'), v=document.getElementById('zView'), b=document.getElementById('zMiniBox');
  zi.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  document.getElementById('zPct').textContent=Math.round(Z.s/Z.min*100)+'%';
  const l=Math.max(0,-Z.x/(Z.iw*Z.s)), t=Math.max(0,-Z.y/(Z.ih*Z.s)), wv=Math.min(1,v.clientWidth/(Z.iw*Z.s)), hv=Math.min(1,v.clientHeight/(Z.ih*Z.s));
  b.style.left=l*100+'%'; b.style.top=t*100+'%'; b.style.width=Math.min(wv,1-l)*100+'%'; b.style.height=Math.min(hv,1-t)*100+'%';
}
function zoomAt(f,cx,cy){ if(!Z.iw) return; const ns=Math.min(Z.min*10,Math.max(Z.min,Z.s*f)), r=ns/Z.s; Z.x=cx-(cx-Z.x)*r; Z.y=cy-(cy-Z.y)*r; Z.s=ns; applyZ(); }
(function(){
  const v=document.getElementById('zView'), pts=new Map(); let last=null, pinch=0;
  v.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY); },{passive:false});
  v.addEventListener('pointerdown',e=>{ v.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); last=[e.clientX,e.clientY]; v.classList.add('drag'); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch=Math.hypot(a[0]-b[0],a[1]-b[1]); } });
  v.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) zoomAt(d/pinch,(a[0]+b[0])/2,(a[1]+b[1])/2); pinch=d; return; }
    Z.x+=e.clientX-last[0]; Z.y+=e.clientY-last[1]; last=[e.clientX,e.clientY]; applyZ(); });
  const up=e=>{ pts.delete(e.pointerId); pinch=0; if(!pts.size) v.classList.remove('drag'); else last=[...pts.values()][0]; };
  v.addEventListener('pointerup',up); v.addEventListener('pointercancel',up);
  v.addEventListener('dblclick',e=>zoomAt(2,e.clientX,e.clientY));
  document.getElementById('zIn').onclick=()=>zoomAt(1.5,innerWidth/2,innerHeight/2);
  document.getElementById('zOut').onclick=()=>zoomAt(1/1.5,innerWidth/2,innerHeight/2);
  document.getElementById('zClose').onclick=closeZoom;
})();

    const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Koetser Gallery//EN','BEGIN:VEVENT',`UID:${e.slug}@koetsergallery.com`,`DTSTART;VALUE=DATE:${d(e.start)}`,`DTEND;VALUE=DATE:${d(endPlus)}`,`SUMMARY:Koetser Gallery at ${e.name}`,`LOCATION:${e.venue}, ${e.address}${e.stand?' – Stand '+e.stand:''}`,`URL:${e.site}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'})); a.download=`koetser-${e.slug}.ics`; document.body.appendChild(a); a.click(); a.remove(); };
  spyChapters();
}
function spyChapters(){
  const links=[...document.querySelectorAll('.chapnav a')]; if(!links.length) return;
  const f=()=>{ let cur=links[0]; links.forEach(a=>{ const el=document.getElementById(a.dataset.jump); if(el&&el.getBoundingClientRect().top<200) cur=a; }); links.forEach(a=>a.classList.toggle('on',a===cur)); };
  SCROLLERS.push(f); f();
}

function bindForm(f){
  f.onsubmit=e=>{ e.preventDefault();
    const req=[...f.querySelectorAll('[required]')], bad=req.filter(i=>!i.value.trim()||!i.checkValidity());
    req.forEach(i=>i.closest('.field').classList.toggle('bad',bad.includes(i)));
    if(bad.length){ bad[0].focus(); return; }
    const n=f.querySelector('input').value;
    f.innerHTML=`<p class="sent full">Thank you, ${esc(n)}. The gallery will reply to you personally.</p><p class="mono muted full">Demo · on the live site this form sends to info@koetsergallery.com</p>`; };

function notFound(){ return `<section class="ph"><div class="wrap"><h1 class="d2">Page not found</h1><p style="margin-top:24px"><a class="btn" href="#/paintings">Back to the paintings ${AR}</a></p></div></section>`; }

/* ── SITE SEARCH ── */
const SCOPES=[['all','Everything'],['paintings','Paintings'],['sales','Notable sales'],['events','Events'],['news','News'],['services','Services']];
let SCOPE='all';
const ICON_EV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="12" rx="1"/><path d="M1.5 6h13M5 1v3M11 1v3"/></svg>';
const ICON_SV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><path d="M8 4v4l3 2"/></svg>';
function hl(s,q){ if(!q) return s; const i=s.toLowerCase().indexOf(q); return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length); }
function runSearch(){
  const q=document.getElementById('sq').value.trim().toLowerCase(), body=document.getElementById('sBody');
  document.getElementById('sScopes').innerHTML=SCOPES.map(s=>`<button class="chip ${s[0]===SCOPE?'on':''}" data-scope="${s[0]}">${s[1]}</button>`).join('');
  document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{ SCOPE=b.dataset.scope; runSearch(); });
  if(q.length<2){ body.innerHTML=`<div class="srch-empty"><p class="lab" style="margin-bottom:14px">Try</p><div class="srch-sugg">${['Van Goyen','Still life','Rubens','TEFAF','Frans Hals','Conservation','Marine'].map(x=>`<button class="chip" data-sugg="${x}">${x}</button>`).join('')}</div></div>`;
    body.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{ document.getElementById('sq').value=b.dataset.sugg; runSearch(); }); return; }
  const has=t=>t.toLowerCase().includes(q);
  const G={
    paintings:WORKS.filter(w=>has(w.artist+' '+w.title+' '+w.genre+' '+w.life+' '+(w.medium||''))).map(w=>({href:'#/painting/'+w.slug,th:pic(w.img,'','t','loading="lazy"'),b:hl(w.artist,q),t:hl(w.title,q),s:w.genre+' · '+w.life})),
    sales:SALES.filter(s=>has(s.artist+' '+s.title+' '+s.now)).map(s=>({href:'#/sale/'+s.slug,th:pic(s.img,'','t','loading="lazy"'),b:hl(s.artist,q),t:hl(s.title,q),s:'Now in '+hl(s.now,q)})),
    events:EVENTS.filter(e=>has(e.name+' '+e.short+' '+e.city+' '+e.venue)||e.list.some(([a,t])=>has(a+' '+t))).map(e=>{ const m=e.list.filter(([a,t])=>has(a+' '+t)); return {href:'#/event/'+e.slug,th:ICON_EV,b:status(e)[0],t:hl(e.name+(e.datesText?' '+e.start.slice(0,4):''),q),s:range(e)+(m.length&&!has(e.name)?` · shows ${m.length} matching painting${m.length>1?'s':''}`:'')}; }),
    news:NEWS.filter(n=>has(n.title+' '+newsText(n)+' '+n.cat+' '+n.artists.join(' '))).map(n=>({href:'#/news/'+n.slug,th:pic(newsImg(n),'','t','loading="lazy"'),b:n.cat+' · '+n.tag,t:hl(n.title,q),s:n.standfirst})),
    services:SERVICES.filter(s=>has(s[1]+' '+s[5]+' '+s[2])).map(s=>({href:'#/services/'+s[0],th:ICON_SV,b:hl(s[1],q),t:s[5],s:s[6]}))
  };
  const names={paintings:'Paintings',sales:'Notable sales',events:'Events',news:'News',services:'Services'};
  const keys=SCOPE==='all'?Object.keys(G):[SCOPE];
  const total=keys.reduce((n,k)=>n+G[k].length,0);
  body.innerHTML = total ? keys.filter(k=>G[k].length).map(k=>`<div class="srch-grp"><h3>${names[k]}<sup>${G[k].length}</sup></h3><div class="srch-list">${G[k].map(h=>`<a class="hit" href="${h.href}"><span class="th">${h.th}</span><span><b>${h.b}</b><span class="t">${h.t}</span><small>${h.s}</small></span></a>`).join('')}</div></div>`).join('')
    : `<div class="srch-empty"><p class="d4" style="color:var(--ink)">Nothing found for “${esc(q)}”.</p><p>Try an artist’s name, a title, a fair or a service.</p></div>`;
}
function openSearch(){ const s=document.getElementById('srch'); s.classList.add('on'); document.body.style.overflow='hidden'; runSearch(); setTimeout(()=>document.getElementById('sq').focus(),50); }
function closeSearch(){ document.getElementById('srch').classList.remove('on'); unlock(); }
document.getElementById('openSearch').onclick=openSearch;
document.getElementById('sClose').onclick=closeSearch;
document.getElementById('sq').oninput=runSearch;
document.getElementById('sBody').addEventListener('click',e=>{ if(e.target.closest('.hit')) closeSearch(); });

/* ── ROUTER ── */
let heroTimer, SCROLLERS=[];
function route(){
  const app=document.getElementById('app');
  const [, page='', arg]=location.hash.replace(/^#/,'').split('/');
  clearInterval(heroTimer); window.onresize=null; SCROLLERS=[]; closeModal(); closeZoom(); closeVideo(); closeSearch();
  document.getElementById('peek').classList.remove('on'); cur.classList.remove('on');
  document.getElementById('nav').classList.remove('open');
  const map={paintings,about,services,'notable-sales':notable,events,news,contact};
  const html = page==='news'&&arg?newsDetail(arg) : page==='painting'?detail(arg) : page==='event'?eventDetail(arg) : page==='sale'?saleDetail(arg) : map[page]?map[page]() : home();
  app.classList.remove('page-in'); void app.offsetWidth; app.classList.add('page-in');
  app.innerHTML=html+footer();
  const sect={painting:'paintings',event:'events',sale:'notable-sales'}[page]||page;
  document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.dataset.r===sect));
  const w=page==='painting'&&WK(arg), ev=page==='event'&&evBy(arg), sa=page==='sale'&&saleBy(arg);
  const nw=page==='news'&&arg&&NEWS.find(n=>n.slug===arg); if(nw) document.title=`${nw.title} — Koetser Gallery`; else document.title = w?`${w.artist}, ${w.title} — Koetser Gallery`: sa?`${sa.artist}, ${sa.title} — Koetser Gallery` : ev?`${ev.name} — Koetser Gallery`:'Koetser Gallery — Old Master Paintings, Zurich';
  if(page==='services'&&arg) setTimeout(()=>{ const el=document.getElementById('svc-'+arg); if(el) scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:'instant'}); },30);
  else scrollTo({top:0,behavior:'instant'});
  after(page,arg);
}
function after(page,arg){
  if(page===''){
    const sl=[...document.querySelectorAll('.slide')], cap=document.getElementById('heroCap'), pr=document.getElementById('hProg'); let k=0;
    const show=n=>{ sl[k].classList.remove('on'); k=(n+sl.length)%sl.length; sl[k].classList.add('on'); const h=HERO_SLIDES[k];
      cap.innerHTML=`<span class="lab kind num">${h.kind} · ${String(k+1).padStart(2,'0')} / ${String(sl.length).padStart(2,'0')}</span><div><h2>${h.title}</h2><p>${h.sub}</p></div><div class="go"><a class="btn fill" href="${h.link}">${h.cta} ${AR}</a>${h.video?`<button class="link" data-video="${h.video}" data-vcap="${esc(h.title)}">Watch the film</button>`:''}</div>`;
      pr.classList.remove('run'); void pr.offsetWidth; pr.classList.add('run'); };
    const restart=()=>{ clearInterval(heroTimer); heroTimer=setInterval(()=>show(k+1),7000); };
    document.getElementById('hNext').onclick=()=>{show(k+1);restart();}; document.getElementById('hPrev').onclick=()=>{show(k-1);restart();};
    show(0); restart();
  }
  if(page==='paintings'){
    GENRE='*'; Q='';
    document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{ GENRE=c.dataset.g; document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x===c)); renderPane(); toResults(); });
    const sv=()=>document.querySelectorAll('#views button').forEach(x=>{ x.classList.toggle('on',x.dataset.v===VIEW); x.setAttribute('aria-selected',x.dataset.v===VIEW); });
    document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; sv(); renderPane(); toResults(); }); sv();
    document.getElementById('q').oninput=e=>{ Q=e.target.value; renderPane(); };
    renderPane();
  }
  if(page==='painting') bindDetail(arg);
  if(page==='sale') bindSale(arg);
  if(page==='event') bindEvent(arg);
  if(page==='news'&&arg){ document.querySelectorAll('[data-ba]').forEach(ba=>{ const r=ba.querySelector('input'); r.oninput=()=>ba.style.setProperty('--x',r.value+'%'); }); bindCursor(); const c=document.getElementById('copyArt'); if(c) c.onclick=()=>{ const ok=document.getElementById('copyArtOk'); (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>ok.textContent='Link copied').catch(()=>ok.textContent=location.href); }; }
  if(page==='news'&&!arg){ NCAT='*'; renderNews(); document.querySelectorAll('#ncats .chip').forEach(c=>c.onclick=()=>{ NCAT=c.dataset.c; document.querySelectorAll('#ncats .chip').forEach(x=>x.classList.toggle('on',x===c)); renderNews(); }); }
  if(page==='notable-sales'){ renderMus('USA'); document.querySelectorAll('#clist button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#clist button').forEach(x=>x.classList.toggle('on',x===b)); renderMus(b.dataset.c); }); }
  if(page==='services'){ const r=document.getElementById('baR'), ba=document.getElementById('ba'); if(r) r.oninput=()=>ba.style.setProperty('--x',r.value+'%'); }
  if(page==='contact'){ const f=document.getElementById('cForm'); f.innerHTML=FORM('c'); document.getElementById('c5').value='Visit the gallery'; bindForm(f); }
  document.querySelectorAll('form.nl').forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const i=f.querySelector('input'), o=f.nextElementSibling; if(!i.value||!i.checkValidity()){ o.textContent='Please enter a valid email address.'; return; } o.textContent='Thank you. You are on the list.'; i.value=''; });
  const bands=[...document.querySelectorAll('[data-plx]')];
  if(bands.length){ const f=()=>bands.forEach(b=>{ const r=b.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return; const off=(r.top+r.height/2-innerHeight/2)*-0.16; b.firstElementChild.style.transform=`translate3d(0,${off}px,0)`; }); SCROLLERS.push(f); f(); }
  reveal(); bindCursor();
}
let io;
function reveal(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); return; }
  io=io||new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
}
const cur=document.getElementById('cur');
function bindCursor(){
  document.querySelectorAll('[data-cursor]:not([data-cb])').forEach(el=>{ el.dataset.cb=1;
    el.addEventListener('mouseenter',()=>{ cur.textContent=el.dataset.cursor; cur.classList.add('on'); });
    el.addEventListener('mouseleave',()=>cur.classList.remove('on')); });
}
addEventListener('mousemove',e=>{ cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px'; },{passive:true});

const modal=document.getElementById('modal'), mForm=document.getElementById('mForm');
function openEnquiry(slug,subject){
  const w=WK(slug);
  mForm.innerHTML=FORM('m'); bindForm(mForm);
  document.getElementById('mRef').innerHTML=w?`<div class="ref">${pic(w.img,'','t')}<div><b>${w.artist}</b><span class="t">${w.title}</span></div></div>`:'<div style="height:20px"></div>';
  document.getElementById('m5').value=w?'A painting':(subject||'A painting');
  document.getElementById('m6').value=w?`I would like more information about “${w.title}” by ${w.artist}.`:'';
  modal.classList.add('on'); document.body.style.overflow='hidden'; setTimeout(()=>document.getElementById('m1').focus(),80);
}
function closeModal(){ modal.classList.remove('on'); unlock(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-enquire]'); if(b){ e.preventDefault(); openEnquiry(b.dataset.enquire,b.dataset.subject); return; }
  const v=e.target.closest('[data-video]'); if(v){ e.preventDefault(); openVideo(v.dataset.video,v.dataset.vcap); return; }
  const z=e.target.closest('[data-zoom]'); if(z){ e.preventDefault(); const im=z.querySelector('img'); openZoom(im&&im.naturalWidth?im.currentSrc:z.dataset.zoom,''); }
});
document.getElementById('mClose').onclick=closeModal;
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); closeZoom(); closeVideo(); closeSearch(); return; }
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing&&!anyOpen()){ e.preventDefault(); openSearch(); return; }
  if(anyOpen()||typing) return;
  if((location.hash.startsWith('#/painting/')||location.hash.startsWith('#/sale/'))&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const a=document.querySelectorAll('.dt-nav a')[e.key==='ArrowLeft'?0:1]; if(a) location.hash=a.getAttribute('href'); }
});
const nav=document.getElementById('nav');
addEventListener('scroll',()=>{ nav.classList.toggle('solid',scrollY>20); SCROLLERS.forEach(f=>f()); },{passive:true});
document.getElementById('burger').onclick=()=>nav.classList.toggle('open');

/* ── DESIGN PROPOSALS switch (see the note at the top of the version styles) ── */
const VERSIONS={1:['Contemporary','Warm grey, Geist and Instrument Serif'],2:['Salon','Ivory paper, classic serif, centred masthead, works mounted on paper'],3:['Nocturne','Dark museum rooms, works on lit stone, Bodoni'],4:['Index','White Swiss grid, numbered works, bold grotesk']};
let vtT;
function setVersion(v,say){
  v=String(v); if(!VERSIONS[v]) v='1';
  document.documentElement.setAttribute('data-v',v); kvFonts(v);
  document.querySelectorAll('#vsw button').forEach(b=>{ const on=b.dataset.set===v; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  try{ localStorage.setItem('koetser-v',v); }catch(e){}
  try{ const u=new URL(location.href); u.searchParams.set('v',v); history.replaceState(null,'',u.pathname+u.search+location.hash); }catch(e){}
  if(say){ const t=document.getElementById('vtoast'); t.innerHTML=`<b>V${v} · ${VERSIONS[v][0]}</b>${VERSIONS[v][1]}`; t.classList.add('on'); clearTimeout(vtT); vtT=setTimeout(()=>t.classList.remove('on'),2600); }
  if(location.hash.startsWith('#/painting/')||location.hash.startsWith('#/sale/')) dispatchEvent(new Event('resize'));
}
document.querySelectorAll('#vsw button').forEach(b=>b.onclick=()=>setVersion(b.dataset.set,true));
setVersion(document.documentElement.getAttribute('data-v'),false);
addEventListener('hashchange',route);
route();
